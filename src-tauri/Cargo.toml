[package]
name = "kidock"
version = "0.1.1-rc.1"
description = "Kidock — the dock where your agents' work arrives."
authors = ["satoryu"]
license = "MIT"
repository = "https://github.com/satoryu/kidock"
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "kidock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
notify-debouncer-full = "0.8.0"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"

[dev-dependencies]
tempfile = "3"
# IPC-level tests (tests/ipc.rs) use `tauri::test` (mock runtime).
tauri = { version = "2", features = ["test"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
